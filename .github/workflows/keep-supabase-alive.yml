name: Keep Supabase Alive

on:
  schedule:
    # Every 5 days at 10:00 UTC (prevents Supabase free tier pause after 7 days of inactivity)
    - cron: '0 10 */5 * *'
  workflow_dispatch: # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          # /auth/v1/health is a plain service health check — it returns 200 for
          # any valid apikey and never touches table-level RLS, unlike querying
          # a table (e.g. products), which can 401 on RLS even while the
          # project is fully awake and healthy.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}")
          echo "Supabase ping status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: Supabase returned status $STATUS"
            exit 1
          fi
